name: Auto Scan Jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger job scan
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/scan-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
